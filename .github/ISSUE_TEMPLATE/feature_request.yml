name: Feature request
description: Suggest a new app feature or improvement.
title: "[Feature]: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Please keep one feature request per issue and explain the user problem first.
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What kind of feature is this?
      options:
        - Reading experience
        - Library management
        - Import / export
        - Parser / file support
        - Customization / themes
        - Accessibility
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
      placeholder: I want to... but currently...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention workarounds or other solutions you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, references, examples, or related issues.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: I am requesting only one feature in this issue.
          required: true
        - label: I used a clear title and did not add placeholder tags like [Feature].
          required: true
