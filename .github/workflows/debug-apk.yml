name: Debug APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  everbook-debug:
    name: Build everbook debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble everbook debug APK
        # gradlew is committed without the executable bit.
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleEverbookDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # github.sha points at the throwaway merge commit on pull_request events.
          name: everbook-debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/everbook/debug/*.apk
          if-no-files-found: error
          retention-days: 30
