name: Documentation
description: Report missing, outdated, or unclear documentation.
title: "[Docs]: "
labels:
  - "type: documentation"
  - "status: needs triage"
body:
  - type: dropdown
    id: docs-area
    attributes:
      label: Documentation area
      options:
        - README
        - Download / install guide
        - In-app help
        - Screenshots / assets
        - Translation
        - Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be improved?
      description: Describe what is missing, wrong, or unclear.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix
      description: Add a proposed change if you have one.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this documentation issue is not already reported.
          required: true
