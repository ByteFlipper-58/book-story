name: Sync labels

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repository labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ruby <<'RUBY'
          require "json"
          require "net/http"
          require "uri"
          require "yaml"

          token = ENV.fetch("GH_TOKEN")
          repository = ENV.fetch("REPOSITORY")
          labels = YAML.load_file(".github/labels.yml")
          api_root = "https://api.github.com/repos/#{repository}/labels"

          def request(method, url, token, body = nil)
            uri = URI(url)
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true

            req = method.new(uri)
            req["Accept"] = "application/vnd.github+json"
            req["Authorization"] = "Bearer #{token}"
            req["X-GitHub-Api-Version"] = "2022-11-28"
            req["Content-Type"] = "application/json"
            req.body = JSON.dump(body) if body

            http.request(req)
          end

          labels.each do |label|
            create_payload = {
              name: label.fetch("name"),
              color: label.fetch("color").to_s.delete_prefix("#"),
              description: label.fetch("description")
            }
            update_payload = create_payload.merge(new_name: create_payload[:name])
            update_payload.delete(:name)

            encoded_name = URI.encode_www_form_component(create_payload[:name])
            update_response = request(Net::HTTP::Patch, "#{api_root}/#{encoded_name}", token, update_payload)

            case update_response.code.to_i
            when 200
              puts "updated #{create_payload[:name]}"
            when 404
              create_response = request(Net::HTTP::Post, api_root, token, create_payload)
              if create_response.code.to_i == 201
                puts "created #{create_payload[:name]}"
              else
                warn "failed to create #{create_payload[:name]}: #{create_response.code} #{create_response.body}"
                exit 1
              end
            else
              warn "failed to update #{create_payload[:name]}: #{update_response.code} #{update_response.body}"
              exit 1
            end
          end
          RUBY
