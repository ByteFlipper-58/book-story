name: Sync labels

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - main
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync repository labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "uri"
          require "yaml"

          token = ENV.fetch("GH_TOKEN")
          repository = ENV.fetch("REPOSITORY")
          ref = ENV.fetch("REF")
          api_root = "https://api.github.com/repos/#{repository}"

          def request(method, url, token, body = nil)
            uri = URI(url)
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true

            req = method.new(uri)
            req["Accept"] = "application/vnd.github+json"
            req["Authorization"] = "Bearer #{token}"
            req["X-GitHub-Api-Version"] = "2022-11-28"
            req["Content-Type"] = "application/json"
            req.body = JSON.dump(body) if body

            http.request(req)
          end

          def label_path(name)
            URI.encode_www_form_component(name).gsub("+", "%20")
          end

          labels_response = request(
            Net::HTTP::Get,
            "#{api_root}/contents/.github/labels.yml?ref=#{ref}",
            token
          )

          unless labels_response.code.to_i == 200
            warn "failed to read .github/labels.yml: #{labels_response.code} #{labels_response.body}"
            exit 1
          end

          labels_file = JSON.parse(labels_response.body)
          labels = YAML.safe_load(Base64.decode64(labels_file.fetch("content")))
          labels_api = "#{api_root}/labels"

          labels.each do |label|
            name = label.fetch("name")
            payload = {
              color: label.fetch("color").to_s.delete_prefix("#"),
              description: label.fetch("description").to_s
            }

            update_response = request(
              Net::HTTP::Patch,
              "#{labels_api}/#{label_path(name)}",
              token,
              payload.merge(new_name: name)
            )

            case update_response.code.to_i
            when 200
              puts "updated #{name}"
            when 404
              create_response = request(
                Net::HTTP::Post,
                labels_api,
                token,
                payload.merge(name: name)
              )

              if create_response.code.to_i == 201
                puts "created #{name}"
              elsif create_response.code.to_i == 422 && create_response.body.include?("already_exists")
                puts "already exists #{name}"
              else
                warn "failed to create #{name}: #{create_response.code} #{create_response.body}"
                exit 1
              end
            else
              warn "failed to update #{name}: #{update_response.code} #{update_response.body}"
              exit 1
            end
          end
          RUBY
