- name: "type: bug"
  color: "d73a4a"
  description: Something is broken or behaves incorrectly.
- name: "type: feature"
  color: "a2eeef"
  description: New feature or improvement request.
- name: "type: parser"
  color: "c5def5"
  description: Book parsing, importing, or file format issue.
- name: "type: documentation"
  color: "0075ca"
  description: Documentation, README, help text, or translation issue.
- name: "type: question"
  color: "d876e3"
  description: Question about usage, setup, or contribution.
- name: "type: refactor"
  color: "e4e669"
  description: Internal code cleanup without intended behavior changes.
- name: "type: maintenance"
  color: "fef2c0"
  description: Project maintenance, dependencies, tooling, or housekeeping.
- name: "priority: low"
  color: "cfd3d7"
  description: Useful but not urgent.
- name: "priority: medium"
  color: "fbca04"
  description: Normal priority.
- name: "priority: high"
  color: "b60205"
  description: Important or time-sensitive.
- name: "priority: critical"
  color: "8b0000"
  description: Severe issue that needs immediate attention.
- name: "status: needs triage"
  color: "ededed"
  description: Needs review before work starts.
- name: "status: needs info"
  color: "d4c5f9"
  description: Waiting for more details from the reporter.
- name: "status: accepted"
  color: "0e8a16"
  description: Accepted and ready to be worked on.
- name: "status: blocked"
  color: "5319e7"
  description: Cannot move forward until something else is resolved.
- name: "status: in progress"
  color: "0052cc"
  description: Work is currently in progress.
- name: "status: duplicate"
  color: "cccccc"
  description: Duplicate of another issue.
- name: "status: wontfix"
  color: "ffffff"
  description: This will not be worked on.
